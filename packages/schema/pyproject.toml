[project]
name = "holo-schema"
version = "0.1.0"
description = "The hololive-ocg-wiki card contract — pydantic models, generated JSON Schema and TypeScript."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holo_schema"]
