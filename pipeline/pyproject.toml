[project]
name = "holo-pipeline"
version = "0.1.0"
description = "The hololive-ocg-wiki data pipeline — scrape, translate, build card data."
requires-python = ">=3.12"
dependencies = [
    "holo-schema",
    "beautifulsoup4>=4.13",
    "requests>=2.32",
    "openai>=1.107",
    "pillow>=11.0",
    "python-dotenv>=1.1",
    "tqdm>=4.67",
    "typer>=0.15",
]

[project.scripts]
holo-data = "holo_data.cli:app"

[tool.uv.sources]
holo-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holo_data"]

[tool.hatch.build.targets.wheel.force-include]
"src/holo_data/translate/prompts.json" = "holo_data/translate/prompts.json"
